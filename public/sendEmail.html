<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotation Form</title>
</head>
<body>
  <h1>Quotation Form</h1>
  <form id="quotationForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="product">Product:</label>
    <input type="text" id="product" name="product" required><br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" required><br><br>

    <label for="price">Price per Unit:</label>
    <input type="number" id="price" name="price" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="response"></p>

  <script>
    document.getElementById('quotationForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        product: document.getElementById('product').value,
        quantity: (document.getElementById('quantity').value*1),
        price: (document.getElementById('price').value*1)
      };

      try {
        const response = await fetch('/api/sendEmail', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        document.getElementById('response').textContent = `Quotation sent successfully to ${formData.email} and the business contact.`;
      } catch (error) {
        console.error('Error sending quotation:', error);
      }
    });
  </script>
</body>
</html>
